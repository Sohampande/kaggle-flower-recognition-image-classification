# This file primarly exists to store variables, paths, etc
#   So that we dont hard-code these into our project.

artifacts_root : artifacts 

data_ingestion : 
  root_dir : artifacts/data_ingestion
  local_data_file : artifacts/data_ingestion/flowers
  root_dataset_name : 'alxmamaev/flowers-recognition'
  unzip_dir : artifacts/data_ingestion/flowers

prepare_base_model : 
  root_dir : artifacts/prepare_base_model
  base_model_path : artifacts/prepare_base_model/base_model.h5
  updated_base_model_path : artifacts/prepare_base_model/base_model_updated.h5

data_transformation:
  root_dir: artifacts/data_transformation
  class_names_path: artifacts/data_transformation/class_names.json
  image_size: [128, 128]
  batch_size: 32
  num_workers: 2
  train_ratio: 0.7
  val_ratio: 0.15
  test_ratio: 0.15
  mean: [0.5, 0.5, 0.5]
  std: [0.5, 0.5, 0.5]
  seed: 42